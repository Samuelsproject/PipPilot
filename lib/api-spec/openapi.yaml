openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Administrator-only membership operations
  - name: workspace
    description: Approved-member workspace access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace/access:
    get:
      operationId: getWorkspaceAccess
      tags: [workspace]
      summary: Verify current workspace membership access
      description: Verifies the current user's membership against server-managed Supabase metadata.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Approved workspace access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAccessResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
        "403":
          description: Email verification or approved membership is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
        "503":
          description: Membership authorization is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
  /workspace/trading/analyze:
    post:
      operationId: analyzeTrading
      tags: [workspace]
      summary: Analyze user-supplied candles for trading structure
      description: Performs deterministic multi-timeframe technical analysis on supplied historical candles. It does not fetch live market data or execute orders.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingAnalysisInput"
      responses:
        "200":
          description: Analysis results or an explicit no-trade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAnalysisResponse"
        "400":
          description: Invalid symbol or candle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAnalysisErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
        "403":
          description: Email verification or approved membership is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
        "503":
          description: Membership authorization is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipAccessErrorResponse"
  /admin/initialize:
    post:
      operationId: initializeAdmin
      tags: [admin]
      summary: Initialize the verified designated administrator
      description: Explicitly initialize server-managed admin metadata for the authenticated designated administrator. The account identity and metadata are derived server-side.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrator metadata is initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMember"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Caller is not the verified designated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "502":
          description: Supabase administrator account could not be loaded or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "503":
          description: Supabase administrator credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List registered users for the designated administrator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrator identity and registered users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Caller is not an initialized, verified designated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "503":
          description: Supabase administrator credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
  /admin/users/{userId}/membership:
    patch:
      operationId: updateAdminMembership
      tags: [admin]
      summary: Update a registered user's membership status
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdateInput"
      responses:
        "200":
          description: Membership status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipUpdateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Caller is not the verified designated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "503":
          description: Supabase administrator credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
  /admin/users/{userId}/terminate-sessions:
    post:
      operationId: terminateAdminUserSessions
      tags: [admin]
      summary: Terminate all active sessions for a registered user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User sessions terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateSessionsResponse"
        "501":
          description: Supabase cannot terminate sessions by user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "400":
          description: Invalid user identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Caller is not the verified designated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "503":
          description: Supabase administrator credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MembershipStatus:
      type: string
      enum: [pending, active, suspended, expired]
    WorkspaceAccessResponse:
      type: object
      required: [userId, membershipStatus]
      properties:
        userId:
          type: string
          format: uuid
        membershipStatus:
          type: string
          enum: [active]
    MembershipAccessErrorResponse:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - INVALID_TOKEN
            - EMAIL_UNVERIFIED
            - MEMBERSHIP_PENDING
            - MEMBERSHIP_SUSPENDED
            - MEMBERSHIP_REVOKED
            - MEMBERSHIP_CHECK_UNAVAILABLE
        error:
          type: string
        membershipStatus:
          $ref: "#/components/schemas/MembershipStatus"
    AdminMember:
      type: object
      required: [id, email, emailVerified, role, membershipStatus, createdAt, lastSignInAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: ["string", "null"]
        emailVerified:
          type: boolean
        role:
          type: string
          enum: [trader, admin]
        membershipStatus:
          $ref: "#/components/schemas/MembershipStatus"
        createdAt:
          type: string
          format: date-time
        lastSignInAt:
          type: ["string", "null"]
          format: date-time
    AdminUsersResponse:
      type: object
      required: [admin, users]
      properties:
        admin:
          $ref: "#/components/schemas/AdminMember"
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminMember"
    MembershipUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MembershipStatus"
    MembershipUpdateResponse:
      type: object
      required: [user, sessionsTerminated]
      properties:
        user:
          $ref: "#/components/schemas/AdminMember"
        sessionsTerminated:
          type: boolean
    TerminateSessionsResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    AdminErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TradingCandle:
      type: object
      required: [timestamp, open, high, low, close]
      properties:
        timestamp:
          type: integer
          minimum: 1
          description: Candle open time as Unix milliseconds
        open:
          type: number
          exclusiveMinimum: 0
        high:
          type: number
          exclusiveMinimum: 0
        low:
          type: number
          exclusiveMinimum: 0
        close:
          type: number
          exclusiveMinimum: 0
        volume:
          type: number
          minimum: 0
    TradingAnalysisInput:
      type: object
      required: [symbol, timeframes]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 64
          description: Broker-specific symbol, for example XAUUSDm, BTCUSD.a, or US30.cash
        timeframes:
          type: object
          properties:
            30M:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/TradingCandle"
            1H:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/TradingCandle"
            4H:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/TradingCandle"
            1D:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/TradingCandle"
    TradingBias:
      type: string
      enum: [bullish, bearish, neutral, unavailable]
    TradingDirection:
      type: string
      enum: [bullish, bearish, neutral]
    TradingTimeframe:
      type: string
      enum: [30M, 1H, 4H, 1D]
    TradingConcept:
      type: object
      required: [kind, direction, evidence]
      properties:
        kind:
          type: string
          enum:
            - BOS
            - CHOCH
            - HH_HL
            - LH_LL
            - LIQUIDITY_SWEEP
            - EQUAL_HIGHS
            - EQUAL_LOWS
            - INDUCEMENT
            - ORDER_BLOCK
            - FAIR_VALUE_GAP
            - SUPPLY_DEMAND
            - SUPPORT_RESISTANCE
            - PREMIUM_DISCOUNT
            - DISPLACEMENT
            - CRT_INTRADAY
            - CRT_SWING
        direction:
          $ref: "#/components/schemas/TradingDirection"
        low:
          type: ["number", "null"]
        high:
          type: ["number", "null"]
        evidence:
          type: string
    TradingIndicators:
      type: object
      required: [atr14, ema20, ema50, rsi14]
      properties:
        atr14:
          type: number
        ema20:
          type: number
        ema50:
          type: number
        rsi14:
          type: number
    TradingTimeframeAnalysis:
      type: object
      required: [timeframe, dataStatus, bias, structure, concepts, indicators]
      properties:
        timeframe:
          $ref: "#/components/schemas/TradingTimeframe"
        dataStatus:
          type: string
          enum: [available, missing, insufficient, stale]
        bias:
          $ref: "#/components/schemas/TradingBias"
        structure:
          type: string
        concepts:
          type: array
          items:
            $ref: "#/components/schemas/TradingConcept"
        indicators:
          oneOf:
            - $ref: "#/components/schemas/TradingIndicators"
            - type: "null"
    TradingTarget:
      type: object
      required: [label, price, riskReward]
      properties:
        label:
          type: string
          enum: [TP1, TP2, TP3]
        price:
          type: number
        riskReward:
          type: number
    TradingSignal:
      type: object
      required:
        - decision
        - status
        - setupTimeframe
        - entryPrice
        - entryLow
        - entryHigh
        - stopLoss
        - targets
        - confidence
        - confidenceExplanation
        - evidence
        - invalidationConditions
        - expiresAt
      properties:
        decision:
          type: string
          enum: [BUY, SELL, NO_TRADE]
        status:
          type: string
          enum: [valid, stale, expired, unavailable]
        setupTimeframe:
          $ref: "#/components/schemas/TradingTimeframe"
        entryPrice:
          type: ["number", "null"]
        entryLow:
          type: ["number", "null"]
        entryHigh:
          type: ["number", "null"]
        stopLoss:
          type: ["number", "null"]
        targets:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TradingTarget"
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Confluence score, not probability of profit
        confidenceExplanation:
          type: string
        evidence:
          type: array
          items:
            type: string
        invalidationConditions:
          type: array
          items:
            type: string
        expiresAt:
          type: ["integer", "null"]
    TradingMacroContext:
      type: object
      required: [status, supportedEvents, excludedEvent, hypothesisPercent, explanation]
      properties:
        status:
          type: string
          enum: [unavailable]
        supportedEvents:
          type: array
          items:
            type: string
            enum: [CPI, PPI, NFP, FOMC]
        excludedEvent:
          type: string
          enum: [PCE]
        hypothesisPercent:
          type: ["integer", "null"]
        explanation:
          type: string
    TradingAnalysisResponse:
      type: object
      required:
        - requestedSymbol
        - canonicalSymbol
        - instrumentClass
        - marketSchedule
        - dataSource
        - analysisTimestamp
        - lastMarketTimestamp
        - marketFreshness
        - currentPrice
        - higherTimeframeBias
        - conflicts
        - timeframes
        - signal
        - macroContext
      properties:
        requestedSymbol:
          type: string
        canonicalSymbol:
          type: ["string", "null"]
        instrumentClass:
          type: string
          enum: [gold, bitcoin, forex, index, unsupported]
        marketSchedule:
          type: string
          enum: [continuous_24_7, broker_defined, fx_weekdays, unavailable]
        dataSource:
          type: string
          enum: [user_supplied_historical, unavailable]
        analysisTimestamp:
          type: integer
        lastMarketTimestamp:
          type: ["integer", "null"]
        marketFreshness:
          type: string
          enum: [fresh, stale, unavailable]
        currentPrice:
          type: ["number", "null"]
        higherTimeframeBias:
          $ref: "#/components/schemas/TradingBias"
        conflicts:
          type: array
          items:
            type: string
        timeframes:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/TradingTimeframeAnalysis"
        signal:
          $ref: "#/components/schemas/TradingSignal"
        macroContext:
          $ref: "#/components/schemas/TradingMacroContext"
    TradingAnalysisErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

